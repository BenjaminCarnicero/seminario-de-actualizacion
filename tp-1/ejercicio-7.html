<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversor C° / F° Mardel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        
        x-weather-table-extended {
            display: block;
            margin: 20px auto;
            max-width: 90%;
            overflow-x: auto;
        }

        .btn-toggle {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-toggle:hover { background-color: #0056b3; }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            text-align: center;
            background-color: #f8f9fa;
            border: 1px solid #a2a9b1;
        }

        th, td { border: 1px solid #a2a9b1; padding: 6px; }
        th { background-color: #eaecf0; font-weight: bold; }
        .row-header { text-align: left; font-weight: bold; background-color: #eaecf0; width: 150px; }

        /* Colores de fondo de la tabla original */
        .t-max-abs { background-color: #cc1111; color: white; font-weight: bold; }
        .t-max-med { background-color: #ff5500; color: black; }
        .t-med { background-color: #ffaa00; color: black; }
        .t-min-med { background-color: #ffcc44; color: black; }
        .t-min-abs { background-color: #e6f2ff; color: black; }
        .precip { background-color: #6688ff; color: white; }
        .dias-precip { background-color: #99ccff; color: black; }
        .sol { background-color: #ffe688; color: black; }
        .humedad { background-color: #0000dd; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Parámetros Climáticos de Mar del Plata (Conversor de Escala)</h2>

    <script>
        class WeatherTableExtended extends HTMLElement {
            constructor() {
                super();
                
                // Estado interno
                this._currentScale = 'C';
                this._months = ["Ene.", "Feb.", "Mar.", "Abr.", "May.", "Jun.", "Jul.", "Ago.", "Sep.", "Oct.", "Nov.", "Dic.", "Anual"];
                
                this._weatherData = [
                    { label: "Temp. máx. abs.", class: "t-max-abs", isTemp: true, values: [42.4, 38.1, 36.3, 32.5, 27.4, 22.2, 27.7, 24.7, 28.8, 34.4, 35.7, 39.4, 39.4] },
                    { label: "Temp. máx. media", class: "t-max-med", isTemp: true, values: [26.3, 25.8, 23.7, 20.5, 16.8, 13.8, 13.1, 14.4, 16.0, 18.5, 21.7, 24.4, 19.6] },
                    { label: "Temp. media", class: "t-med", isTemp: true, values: [20.3, 19.9, 18.0, 14.6, 11.3, 8.5, 8.1, 8.9, 10.5, 13.1, 15.9, 18.5, 14.0] },
                    { label: "Temp. mín. media", class: "t-min-med", isTemp: true, values: [14.3, 14.1, 12.5, 9.1, 6.4, 4.1, 3.8, 4.0, 5.3, 7.6, 10.1, 12.7, 8.7] },
                    { label: "Temp. mín. abs.", class: "t-min-abs", isTemp: true, values: [4.7, 1.2, 1.9, -1.0, -3.0, -5.5, -9.3, -6.4, -5.5, -3.0, -2.0, -0.2, -9.3] },
                    { label: "Precipitación total (mm)", class: "precip", isTemp: false, values: [100.1, 72.8, 107.0, 73.3, 73.5, 54.9, 58.9, 64.0, 56.4, 83.4, 75.3, 104.0, 923.6] },
                    { label: "Días de precipitaciones (≥ 0.1 mm)", class: "dias-precip", isTemp: false, values: [9, 8, 9, 9, 9, 9, 9, 8, 7, 10, 10, 10, 107] },
                    { label: "Horas de sol", class: "sol", isTemp: false, values: [288.3, 234.5, 232.5, 195.0, 167.4, 120.0, 127.1, 164.3, 174.0, 210.8, 222.0, 269.7, 2405.6] },
                    { label: "Humedad relativa (%)", class: "humedad", isTemp: false, values: [76, 77, 79, 81, 83, 84, 81, 81, 80, 80, 77, 76, 80] }
                ];

                this._tempCellsReferences = [];

                // Construccion del DOM
                this.container = document.createElement("div");
                
                this.button = document.createElement("button");
                this.button.className = "btn-toggle";
                this.button.innerText = "Cambiar a Fahrenheit (°F)";

                this.table = document.createElement("table");

                // Fila de encabezados (Meses)
                const headerRow = document.createElement("tr");
                const firstHeader = document.createElement("th");
                firstHeader.innerText = "Mes";
                headerRow.append(firstHeader);

                for (const month of this._months) {
                    const th = document.createElement("th");
                    th.innerText = month;
                    headerRow.append(th);
                }
                this.table.append(headerRow);

                // Filas de datos climáticos
                for (const rowData of this._weatherData) {
                    const row = document.createElement("tr");
                    
                    const headerCell = document.createElement("td");
                    headerCell.className = "row-header";
                    headerCell.innerText = rowData.label + (rowData.isTemp ? " (°" + this._currentScale + ")" : "");
                    row.append(headerCell);

                    for (const val of rowData.values) {
                        const td = document.createElement("td");
                        td.className = rowData.class;
                        td.innerText = val;
                        row.append(td);

                        if (rowData.isTemp) {
                            this._tempCellsReferences.push({
                                elementTd: td,
                                celsiusValue: val
                            });
                        }
                    }

                    if (rowData.isTemp) {
                        this._tempCellsReferences.push({
                            elementHeaderCell: headerCell,
                            baseLabel: rowData.label
                        });
                    }

                    this.table.append(row);
                }

                this.container.append(this.button, this.table);
            }

            // Metodos publicos
            getTemperatureAverages() {
                const averages = {};
                for (const row of this._weatherData) {
                    if (row.isTemp) {
                        // El último valor del array es el promedio Anual (índice 12)
                        averages[row.label] = row.values[12];
                    }
                }
                return averages;
            }

            // Interaccion (logica)
            onToggleScale() {
                this._currentScale = this._currentScale === 'C' ? 'F' : 'C';

                // Modificar el texto del botón
                this.button.innerText = "Cambiar a " + (this._currentScale === 'C' ? "Fahrenheit (°F)" : "Celsius (°C)");

                // Actualizar los valores (sin alterar el DOM de la tabla completa)
                for (const ref of this._tempCellsReferences) {
                    if (ref.elementTd) {
                        if (this._currentScale === 'F') {
                            const fahrenheitVal = (ref.celsiusValue * 1.8) + 32;
                            ref.elementTd.innerText = fahrenheitVal.toFixed(1);
                        } else {
                            ref.elementTd.innerText = ref.celsiusValue;
                        }
                    } else if (ref.elementHeaderCell) {
                        ref.elementHeaderCell.innerText = ref.baseLabel + " (°" + this._currentScale + ")";
                    }
                }
            }

            // Ciclo de vida
            connectedCallback() {
                console.log("Componente x-weather-table-extended conectado.");
                
                //Asignacion del manejador
                this.button.onclick = this.onToggleClick.bind(this);
            }

            disconnectedCallback() {
                console.log("Componente x-weather-table-extended desconectado.");
                
                this.button.onclick = null;
            }

            // Alias semántico para enlazar el evento sin callbacks anónimos
            onToggleClick() {
                this.onToggleScale();
            }
        }

        customElements.define('x-weather-table-extended', WeatherTableExtended);

        // Funcion main
        function main() {
            const extendedTable = document.createElement("x-weather-table-extended");
            extendedTable.append(extendedTable.container);
            document.body.append(extendedTable);

            console.log("Conjunto de promedios de temperatura (Valores Anuales):");
            console.log(extendedTable.getTemperatureAverages());
        }

        window.onload = main;
    </script>
</body>
</html>
