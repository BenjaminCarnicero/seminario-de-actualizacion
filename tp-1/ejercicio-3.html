<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Equalizer</title>
    <style>
        body { background-color: #d4d0c8; padding: 20px; font-family: sans-serif; }
        
        x-equalizer {
            display: inline-block;
            border: 2px outset #eee;
            padding: 10px;
            background-color: #d4d0c8;
        }

        .eq-container { display: flex; gap: 5px; }

        .slider-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px inset #fff;
            padding: 5px;
            width: 50px;
        }

        .slider-group label { font-size: 10px; margin-bottom: 5px; }

        /* Estilo moderno y estandarizado para sliders verticales */
        .slider-group input[type=range] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 15px;
            height: 150px;
            padding: 0 5px;
            cursor: pointer;
        }

        .db-value { font-size: 10px; margin-top: 5px; }
    </style>
</head>
<body>

    <script>
        class Equalizer extends HTMLElement {
            constructor() {
                super(); 
                
             
                this._data = {
                    "32Hz": 0, "64Hz": 0, "130Hz": 0, "260Hz": 0, "500Hz": 0,
                    "1k": 0, "2k": 0, "4k": 0, "8.3k": 0, "16.5k": 0
                };

                this._slidersReferences = [];

                //Construccion estatica del DOM
                this.container = document.createElement("div");
                this.container.className = "eq-container";

                for (const [freq, val] of Object.entries(this._data)) {
                    const group = document.createElement("div");
                    group.className = "slider-group";

                    const label = document.createElement("label");
                    label.innerText = freq;

                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = -12;
                    slider.max = 12;
                    slider.value = val;

                    const dbText = document.createElement("span");
                    dbText.className = "db-value";
                    dbText.innerText = (val > 0 ? '+' : '') + val + "dB";

                    group.append(label, slider, dbText);
                    this.container.append(group);

                    this._slidersReferences.push({
                        frecuencia: freq,
                        inputSlider: slider,
                        textoDB: dbText
                    });
                }
            }

            // Manejadores de eventos
            onSliderInputChange(referenceObject, event) {
                const nuevoValor = parseInt(event.currentTarget.value);
                this._data[referenceObject.frecuencia] = nuevoValor;
                referenceObject.textoDB.innerText = (nuevoValor > 0 ? '+' : '') + nuevoValor + "dB";
            }

            // getter / setter
            getData() {
                return this._data;
            }

            setData(newData) {
                this._data = Object.assign({}, this._data, newData);
                
                for (let i = 0; i < this._slidersReferences.length; i++) {
                    const ref = this._slidersReferences[i];
                    if (newData[ref.frecuencia] !== undefined) {
                        const valorActualizado = newData[ref.frecuencia];
                        ref.inputSlider.value = valorActualizado;
                        ref.textoDB.innerText = (valorActualizado > 0 ? '+' : '') + valorActualizado + "dB";
                    }
                }
            }

            // Ciclo de vida del WebComponent
            connectedCallback() {
                console.log("Equalizer listo en el DOM");
                
                
                this.append(this.container);
                
                for (let i = 0; i < this._slidersReferences.length; i++) {
                    const ref = this._slidersReferences[i];

                    // Enlazo de forma explícita con bind(this) pasando el objeto de referencia
                    ref._boundHandler = this.onSliderInputChange.bind(this, ref);
                    ref.inputSlider.oninput = ref._boundHandler;
                }
            }

            disconnectedCallback() {
                console.log("Equalizer removido del DOM");
                //Operación estrictamente inversa al connectedCallback
                for (let i = 0; i < this._slidersReferences.length; i++) {
                    const ref = this._slidersReferences[i];
                    ref.inputSlider.oninput = null;
                    ref._boundHandler = null;
                }
            }
        }

        customElements.define('x-equalizer', Equalizer);

        // Funcion main
        function main() {
            // Componente en memoria
            const eq = document.createElement("x-equalizer");
            
            
            document.body.append(eq);
            
            console.log("Datos iniciales del ecualizador:", eq.getData());
            eq.setData({ "1k": 8, "2k": -5, "32Hz": 12 });
            console.log("Datos actualizados inmediatamente en el main()");
        }

        window.onload = main;
    </script>
</body>
</html>
