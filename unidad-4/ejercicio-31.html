<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Ejercicio 31 </title>
</head>

<body>

<script type="text/javascript">

class Model extends EventTarget {
    constructor() {
        super();
    }
   
    changed() {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}


class View extends HTMLElement {
    constructor() {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 800;
        this._canvas.height = 600;
        this._canvas.style.border = '1px solid black';

        this.ctx = this._canvas.getContext('2d');
        
        this.appendChild(this._canvas);

        this.drawRect();
    }
    
    drawRect() {
        let x = 100;
        let y = 100;
        let rectWidth = 200;
        let rectHeight = 100;
        let tanY = Math.tan(Math.PI / 4);

        this.ctx.clearRect(0, 0, this._canvas.width, this._canvas.height);

        this.ctx.save();

        // Inclinación oblicua sobre el eje Y (Skew Y)
        this.ctx.transform(1, tanY, 0, 1, 0, 0);


        this.ctx.beginPath();
        this.ctx.rect(x, y, rectWidth, rectHeight);
        this.ctx.strokeStyle = 'green';
        this.ctx.lineWidth = 2;
        this.ctx.stroke();
        this.ctx.closePath();
        this.ctx.restore();
    }

    set value(x) {}
   
    get value() {}

    connectedCallback() {
    }

    disconnectedCallback() {
    }
}


customElements.define('x-view', View);


class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
    }

    enable() {
    }

    disable() {
    }

    onModelChanged() {
    }

    onViewRequest(event) {
    }
}

function main() {
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    document.body.appendChild(myView);
}

window.onload = main;

</script>

</html>
