<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Dardos</title>
    <script src="MVCCanvas.js"></script>
</head>
<body>

    <script type="text/javascript">
        
        function exercise5(canvas) {
            canvas.width = 500;
            canvas.height = 500;

            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;  // 250
            const centerY = canvas.height / 2; // 250
            
            const scores = [1000, 750, 500, 100, 50];
            const ringCount = scores.length; // 5
            const radiusStep = centerX / ringCount; // 50px

            
            for (let i = 1; i <= ringCount; i++) {
                const radius = i * radiusStep;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Ubicacion de cada puntaje en su correspondiente franja
            for (let i = 0; i < ringCount; i++) {
                const scoreValue = scores[i];
                let positionY;

                if (i === 0) {
                    positionY = centerY;
                } else {
                    // punto medio entre dos radios consecutivos
                    const innerRadius = i * radiusStep;
                    const outerRadius = (i + 1) * radiusStep;
                    const middleRadius = (innerRadius + outerRadius) / 2;
                    positionY = centerY - middleRadius;
                }

                ctx.fillText(scoreValue.toString(), centerX, positionY);
            }
        }

        
        function main() {
            const view = new View();
            document.body.appendChild(view);

            view.render(exercise5);
        }

        window.onload = main;
    </script>

</body>
</html>
